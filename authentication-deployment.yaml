apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication-service
spec:
  replicas: 5
  selector:
    matchLabels:
      app: authentication-service

  template:
    metadata:
      labels:
        app: authentication-service

    spec:
      containers:
        - name: authentication-service
          image: authentication-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 7079

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 7079
            initialDelaySeconds: 20
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 7079
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: authentication-service

spec:
  type: NodePort

  selector:
    app: authentication-service

  ports:
    - port: 7079
      targetPort: 7079
      nodePort: 30061